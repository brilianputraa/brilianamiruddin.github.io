---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-meta">
      <span>&#x1F4C5; {{ page.date | date: '%Y-%m-%d' }}</span>
      <span>&#x1F3CB; {{ page.difficulty | default: 'N/A' }}</span>
      <span>&#x23F1; {{ page.duration | default: 'N/A' }}</span>
      <span>&#x1F3D4; {{ page.elevation | default: 'N/A' }}</span>
    </div>
  </header>

  <div class="post-content">
    {% if page.photos %}
    <div class="hike-photos">
      {% for photo in page.photos %}
      <img src="{{ photo | relative_url }}" alt="{{ page.title }}" style="max-width: 100%; margin-bottom: 1rem; border-radius: 8px;">
      {% endfor %}
    </div>
    {% endif %}

    {{ content }}
  </div>
</article>
